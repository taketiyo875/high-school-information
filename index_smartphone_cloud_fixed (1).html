<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校受験生勉強会!! 公式ホームページ</title>
    <style>
        /* 全体の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        /* 画面トップのメインタイトル */
        .main-title {
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0 30px 0;
            color: #222222;
        }

        /* セクション共通の見出しスタイル */
        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin: 35px 0 15px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* ボタンの基本リセットと共通スタイル */
        a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .btn {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        .btn-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .btn-sub {
            font-size: 0.85rem;
            color: #555555;
            line-height: 1.4;
        }

        /* ① 2x2 四分割エリア (すべて正方形) */
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* 正方形を維持するためのボックス */
        .square-box {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1の比率 */
        }

        .square-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .btn-cream {
            background-color: #fffdf0; /* 薄クリーム色 */
        }

        /* もこもこ雲のメッセージオブジェクト */
        .cloud-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cloud-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .cloud-text {
            position: relative;
            z-index: 1;
            font-size: 1rem;
            font-weight: bold;
            color: #2c5aa0;
            text-align: center;
            line-height: 1.5;
            padding: 10px;
        }

        /* ② 高校受験部屋・大学受験部屋セクション */
        .main-chat-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-main-chat {
            background-color: #ffe6eb; /* 薄ピンク色 */
            padding: 22px;
        }

        .sub-hint-messages {
            text-align: center;
            font-size: 0.85rem;
            color: #666666;
            margin-top: 4px;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .u-heading {
            font-size: 1rem;
            font-weight: bold;
            color: #8b3a62;
            margin: 15px 0 5px 0;
            text-align: center;
        }

        .btn-univ-chat {
            background-color: #f5e6e8; /* 薄ワインレッド色 */
            padding: 20px;
        }

        /* ③ 教科特化型部屋セクション */
        .grid-special {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-math {
            background-color: #f2f2f2; /* 薄グレー色 */
            padding: 18px 10px;
        }

        .btn-eng {
            background-color: #fff5e6; /* 薄オレンジ色 */
            padding: 18px 10px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { max-width: 100%; }
            .main-title {
                font-size: 1.25rem;
                line-height: 1.4;
                margin: 12px 0 20px;
                white-space: nowrap;
            }
            .grid-2x2 { gap: 10px; margin-bottom: 24px; }
            .square-content { padding: 7px; }
            .btn-title {
                font-size: 0.9rem;
                line-height: 1.35;
                white-space: nowrap;
            }
            .btn-sub {
                font-size: 0.72rem;
                line-height: 1.35;
                white-space: nowrap;
            }
            .cloud-text {
                font-size: 0.82rem;
                line-height: 1.4;
                white-space: nowrap;
            }
            .section-title {
                font-size: 1rem;
                line-height: 1.4;
                margin: 26px 0 12px;
                white-space: nowrap;
            }
            .btn-main-chat,
            .btn-univ-chat,
            .btn-math,
            .btn-eng { padding: 15px 10px; }
            .sub-hint-messages {
                font-size: 0.78rem;
                line-height: 1.55;
            }
            .u-heading { font-size: 0.9rem; }
            .grid-special { gap: 10px; }
        }

        @media (max-width: 380px) {
            body { padding: 7px; }
            .main-title { font-size: 1.08rem; }
            .section-title { font-size: 0.9rem; }
            .btn-title { font-size: 0.8rem; }
            .btn-sub { font-size: 0.65rem; }
            .cloud-text { font-size: 0.75rem; }
        }

        .cloud-container {
            overflow: visible;
        }

        .cloud-svg {
            transform: scale(1.04);
            transform-origin: center;
        }

        @media (max-width: 600px) {
            .cloud-svg {
                transform: scale(1.02);
            }
        }
    </style>
</head>
<body>
